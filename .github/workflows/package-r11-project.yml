name: Package R11 Project

on:
  push:
    branches:
      - codex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codex
        uses: actions/checkout@v4

      - name: Write build info
        shell: bash
        run: |
          cat > R11_PACKAGE_INFO.txt <<EOF
          Project: FGA R11
          Source branch: codex
          Source commit: 854fed99bd8b43b5c531c5624db24e3b4e5988c8
          Fix: guard turn-start/status-page misclicks and dialog close taps
          Packaged by GitHub Actions
          EOF

      - name: Package source project
        shell: bash
        run: |
          zip -r FGA_R11_StatusPageFix_854fed9_Source.zip . \
            -x ".git/*" \
               ".github/workflows/package-r11-project.yml" \
               "FGA_R11_StatusPageFix_854fed9_Source.zip"

      - name: Upload project package
        uses: actions/upload-artifact@v4
        with:
          name: FGA_R11_StatusPageFix_854fed9_Source
          path: FGA_R11_StatusPageFix_854fed9_Source.zip
          if-no-files-found: error
